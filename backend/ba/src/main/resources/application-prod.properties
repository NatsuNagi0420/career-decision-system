# Production Environment Configuration
# 生产环境配置文件
# 使用方式：--spring.profiles.active=prod

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration - Production
# 生产环境必须通过环境变量配置，不提供默认值以确保安全
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=GMT%2B8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection Pool Configuration - Production
# 生产环境连接池优化配置
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Database Initialization - Production
# 生产环境禁止自动初始化数据库
spring.sql.init.mode=never

# Logging - Production
# 生产环境使用 INFO 级别，减少日志输出
logging.level.root=INFO
logging.level.com.example.ba=INFO
logging.level.com.example.ba.mapper=INFO

# AI Configuration - Production
# 生产环境必须通过环境变量配置，不提供默认值
ai.api.key=${AI_API_KEY}
ai.api.base-url=${AI_API_BASE_URL}
ai.api.model=${AI_API_MODEL}

# Static Resources Configuration - Production
# 生产环境必须通过环境变量配置绝对路径
static.uploads.path=${STATIC_UPLOADS_PATH}
