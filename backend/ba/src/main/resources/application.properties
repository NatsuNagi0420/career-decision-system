# Server Configuration
server.port=${SERVER_PORT:8080}
# 允许所有 IP 访问，包括 192.168.1.199
server.address=0.0.0.0

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/career_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always

# MyBatis Configuration
mybatis.type-aliases-package=com.example.ba.pojo
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Logging
logging.level.com.example.ba.mapper=debug

# AI Configuration (大模型配置)
# 兼容 OpenAI 兼容接口与部分网关/工具使用的 Anthropic 环境变量命名（如 Codex 类工具）
# 优先级：AI_* > ANTHROPIC_* > 默认值
ai.api.key=${AI_API_KEY:${ANTHROPIC_AUTH_TOKEN:}}
ai.api.base-url=${AI_API_BASE_URL:${ANTHROPIC_BASE_URL:https://api.deepseek.com}}
ai.api.model=${AI_API_MODEL:${ANTHROPIC_MODEL:deepseek-v4-flash}}
