server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: career-decision-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/career_decision_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: legacy schema baseline
    locations: classpath:db/migration
    validate-migration-naming: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

career:
  readiness:
    app-env: ${APP_ENV:local}
    database-username: ${DB_USERNAME:root}
    database-password: ${DB_PASSWORD:root}
  auth:
    token-expire-days: ${AUTH_TOKEN_EXPIRE_DAYS:7}
    refresh-token-expire-days: ${AUTH_REFRESH_TOKEN_EXPIRE_DAYS:30}
    login-rate-limit:
      enabled: ${AUTH_LOGIN_RATE_LIMIT_ENABLED:true}
      max-attempts: ${AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:5173,https://127.0.0.1:5173,https://192.168.1.159:5173}
  agent-server:
    base-url: ${AGENT_SERVER_BASE_URL:http://127.0.0.1:8001}
    internal-token: ${AGENT_INTERNAL_TOKEN:${INTERNAL_API_TOKEN:change-me}}
    timeout-seconds: ${AGENT_SERVER_TIMEOUT_SECONDS:30}
  data-server:
    root-location: ${DATA_SERVER_ROOT:./data_server}
    public-path: /data-server
