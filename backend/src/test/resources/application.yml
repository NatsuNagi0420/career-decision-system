spring:
  datasource:
    url: jdbc:h2:mem:career_decision_test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true

career:
  auth:
    token-expire-days: ${AUTH_TOKEN_EXPIRE_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  agent-server:
    base-url: ${AGENT_SERVER_BASE_URL:http://127.0.0.1:8001}
    internal-token: ${AGENT_INTERNAL_TOKEN:${INTERNAL_API_TOKEN:test}}
    timeout-seconds: ${AGENT_SERVER_TIMEOUT_SECONDS:30}
