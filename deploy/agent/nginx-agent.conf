# 青穗集 · agent.suinai.me 反向代理示例；证书由 Certbot 或阿里云证书部署。
server {
    listen 80;
    listen [::]:80;
    server_name agent.suinai.me;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent.suinai.me;
    ssl_certificate /etc/letsencrypt/live/agent.suinai.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.suinai.me/privkey.pem;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
