[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-decision-server"
version = "0.1.0"
description = "Career decision agent server (v2): one process owning API, auth, agent runtime and writes"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pymysql>=1.1",
    "cryptography>=44",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The product is Chinese-facing: fullwidth punctuation inside Chinese strings is
# intentional, not a typo to flag.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Alembic stamps `import sqlalchemy as sa` and the mysql dialect into every revision
# whether the body uses them or not. Lint the logic, tolerate the boilerplate.
"migrations/versions/*" = ["F401", "RUF100"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
